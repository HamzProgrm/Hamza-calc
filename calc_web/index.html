<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Hamza Calc</title>

    <link rel="stylesheet" href="style.css" />
  </head>

  <body class="dark">
    <div class="app">
      <header class="top-bar">
        <div>
          <h1>Hamza Calc</h1>
          <p>Simple • Fast • Clean</p>
        </div>

        <button id="themeButton" class="theme-button">☀️ Light</button>
      </header>

      <main class="calculator">
        <div class="display" id="display" aria-live="polite">0</div>

        <div class="numbers">
          <button class="calc-button number">7</button>
          <button class="calc-button number">8</button>
          <button class="calc-button number">9</button>
          <button class="calc-button operator">/</button>

          <button class="calc-button number">4</button>
          <button class="calc-button number">5</button>
          <button class="calc-button number">6</button>
          <button class="calc-button operator">*</button>

          <button class="calc-button number">1</button>
          <button class="calc-button number">2</button>
          <button class="calc-button number">3</button>
          <button class="calc-button operator">-</button>

          <button class="calc-button number">0</button>
          <button class="calc-button number">00</button>
          <button class="calc-button number">.</button>
          <button class="calc-button equal">=</button>

          <button class="calc-button clear">C</button>
          <button class="calc-button delete">⌫</button>
          <button class="calc-button operator">+</button>
        </div>
      </main>
    </div>

    <script src="main.js"></script>
  </body>
</html>
